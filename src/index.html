<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <title>Document</title>
</head>
<body>
    <main class="poster-wrapper">
        <article class="poster-card">
            <header class="poster-header">
                <h1>LA SEDE</h1>
                <p class="banner">TE ACOMPAÑA</p>
            </header>

            <section class="poster-body">
                <h2>El respeto no se negocia</h2>
                <p class="subtitle">¡Pará ya de acosar!</p>
                <div class="qr-grid">
                    <div class="qr-placeholder" aria-label="QR code"></div>
                    <p>Escaneá y conocé tus derechos</p>
                </div>
            </section>

            <footer class="poster-footer">
                <div class="people-grid">
                    <div class="person person-blue">
                        <div class="arm"></div>
                        <div class="face"></div>
                        <p>UCR</p>
                    </div>
                    <div class="person person-teal">
                        <div class="arm"></div>
                        <div class="face"></div>
                        <p>SG</p>
                    </div>
                </div>
            </footer>
        </article>
    </main>
</body>
</html>
